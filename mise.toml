[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
goreleaser = "2.18.2"

[env]
LOG_LEVEL = "debug"

[tasks.run]
description = "Run the main application"
run = "go run ."

[tasks.build]
description = "Build the binary with goreleaser"
run = "goreleaser build --snapshot --clean"

[tasks.test]
description = "Run all go tests"
run = "go test ./..."

[tasks.coverage]
description = "Run tests with race detection and coverage"
run = "go test -race -coverprofile=coverage.out -covermode=atomic ./... -v -cover"

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Run golangci-lint fmt"
run = "golangci-lint fmt"

[tasks.check]
description = "Run all checks for PRs (tidy, lint, test)"
run = [
    { task = "tidy" },
    { task = "lint" },
    { task = "test" },
]

[tasks.demo]
description = "Build svx and bring up the demo stack in testdata/demo"
dir = "testdata/demo"
run = "go build -o ../../dist/svx ../.. && ../../dist/svx up"

[tasks."demo:down"]
description = "Stop the demo stack"
dir = "testdata/demo"
run = "go build -o ../../dist/svx ../.. && ../../dist/svx down"

[tasks.integration]
description = "Run end-to-end tests against a freshly built binary and a private tmux server"
run = "go build -o dist/svx-integration . && CLI_INTEGRATION=1 SVX_BIN=$PWD/dist/svx-integration go test -count=1 -tags integration ./test/integration/..."
